name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Only the minimal test tooling — the core modules under test use
        # pure-Python fallbacks, so no heavy app/runtime deps are installed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=utils --cov=quant_engine --cov=risk_engine \
            --cov=sentiment_engine --cov=alert_engine \
            --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
              print(f"Total line coverage: {rate * 100:.1f}%")
          except Exception as e:
              print(f"Could not read coverage.xml: {e}")
          PY
